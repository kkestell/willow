name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.bootstrap -t willow-bootstrap .
      - run: docker run --rm willow-bootstrap

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install qbe bdw-gc pcre2 pkgconf
      - run: make bootstrap-test
